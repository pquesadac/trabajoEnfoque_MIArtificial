<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asistente Técnico - YonaApp</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #4f6ef7;
      --accent-dim: rgba(79,110,247,0.12);
      --text: #e2e4ed;
      --text-muted: #6b7080;
      --bot-bg: #1e2130;
      --user-bg: #4f6ef7;
      --success: #3ecf8e;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'IBM Plex Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .header {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 0 18px 0;
    }

    .header-icon {
      width: 38px;
      height: 38px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .header-text p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--success);
      font-family: var(--font-mono);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: 540px;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .bot .avatar  { background: var(--accent-dim); border: 1px solid var(--accent); }
    .user .avatar { background: var(--user-bg); }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 3px;
      color: var(--text);
    }

    .user .bubble {
      background: var(--user-bg);
      border-top-right-radius: 3px;
      color: #fff;
    }

    .timestamp {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 5px;
    }

    .bot .timestamp  { text-align: left; }
    .user .timestamp { text-align: right; }

    .typing {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      border-top-left-radius: 3px;
      width: fit-content;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-5px); }
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
    }

    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13.5px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 120px;
      transition: border-color 0.2s;
    }

    textarea::placeholder { color: var(--text-muted); }
    textarea:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
      font-size: 16px;
    }

    button:hover  { opacity: 0.85; }
    button:active { transform: scale(0.94); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 0 20px 14px;
    }

    .quick-btn {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 20px;
      color: var(--accent);
      font-size: 11.5px;
      font-family: var(--font-mono);
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.2s;
      width: auto;
      height: auto;
    }

    .quick-btn:hover { background: rgba(79,110,247,0.25); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🤖</div>
    <div class="header-text">
      <h1>YonaApp / Asistente Virtual</h1>
      <p>Soporte técnico automatizado · PLN</p>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      en línea
    </div>
  </div>

  <div class="chat-container">
    <div class="messages" id="messages"></div>

    <div class="quick-replies" id="quickReplies">
      <button class="quick-btn" onclick="sendQuick('No tengo internet')">Sin internet</button>
      <button class="quick-btn" onclick="sendQuick('Olvidé mi contraseña')">Contraseña</button>
      <button class="quick-btn" onclick="sendQuick('El ordenador no enciende')">Hardware</button>
      <button class="quick-btn" onclick="sendQuick('La aplicación da error')">Software</button>
      <button class="quick-btn" onclick="sendQuick('Necesito hablar con un técnico')">Técnico</button>
    </div>

    <div class="input-area">
      <textarea
        id="input"
        rows="1"
        placeholder="Escribe tu consulta..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="sendBtn" onclick="sendMessage()" title="Enviar">➤</button>
    </div>
  </div>

  <script>
    const API_URL = "/consulta";

    function getTime() {
      return new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
    }

    function addMessage(text, role) {
      const container = document.getElementById("messages");

      const wrapper = document.createElement("div");
      wrapper.classList.add("message", role);

      const avatar = document.createElement("div");
      avatar.classList.add("avatar");
      avatar.textContent = role === "bot" ? "🤖" : "👤";

      const inner = document.createElement("div");

      const bubble = document.createElement("div");
      bubble.classList.add("bubble");
      bubble.textContent = text;

      const ts = document.createElement("div");
      ts.classList.add("timestamp");
      ts.textContent = getTime();

      inner.appendChild(bubble);
      inner.appendChild(ts);
      wrapper.appendChild(avatar);
      wrapper.appendChild(inner);
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping() {
      const container = document.getElementById("messages");
      const wrapper = document.createElement("div");
      wrapper.classList.add("message", "bot");
      wrapper.id = "typing";

      const avatar = document.createElement("div");
      avatar.classList.add("avatar");
      avatar.textContent = "🤖";

      const typing = document.createElement("div");
      typing.classList.add("typing");
      typing.innerHTML = "<span></span><span></span><span></span>";

      wrapper.appendChild(avatar);
      wrapper.appendChild(typing);
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    async function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      input.style.height = "auto";
      document.getElementById("sendBtn").disabled = true;
      document.getElementById("quickReplies").style.display = "none";

      addMessage(text, "user");
      showTyping();

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: text }),
        });
        const data = await res.json();
        removeTyping();
        addMessage(data.respuesta, "bot");
      } catch {
        removeTyping();
        addMessage("Error al conectar con el servidor. Comprueba que la API está en marcha.", "bot");
      }

      document.getElementById("sendBtn").disabled = false;
      input.focus();
    }

    function sendQuick(text) {
      document.getElementById("input").value = text;
      sendMessage();
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    window.onload = () => {
      addMessage(
        "¡Hola! Soy el asistente virtual de YonaApp.\nPuedo ayudarte con problemas de red, contraseñas, hardware y software.\n¿En qué puedo ayudarte hoy?",
        "bot"
      );
    };
  </script>
</body>
</html>
